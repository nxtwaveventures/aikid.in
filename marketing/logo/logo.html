<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Story Lab logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800&display=block" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { background: #3f9469; position: relative; font-family: "Lilita One", sans-serif; }
  /* hills (kept low so the circular crop still shows them) */
  .hill { position: absolute; border-radius: 50%; }
  .h1 { width: 1400px; height: 700px; left: -160px; top: 760px; background: #2b5c48; }
  .h2 { width: 900px; height: 600px; left: -300px; top: 860px; background: #24503f; }
  .h3 { width: 900px; height: 600px; left: 560px; top: 880px; background: #1e4536; }
  .post { position: absolute; left: 520px; top: 330px; width: 40px; height: 800px; background: #1c1028; border-radius: 20px 20px 0 0; }
  .star { position: absolute; left: 540px; top: 150px; transform: translateX(-50%); width: 220px; height: 220px; filter: drop-shadow(0 10px 0 rgba(0,0,0,.15)); }
  .sign { position: absolute; left: 90px; top: 410px; width: 900px; height: 300px; transform: rotate(-3deg); }
  .sign svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 18px 0 rgba(0,0,0,.2)); }
  .sign .t { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #3a2216; padding-bottom: 14px; }
  .sign b { font-weight: 400; font-size: 190px; line-height: .95; letter-spacing: -2px; }
  .sign span { font-family: "Nunito", sans-serif; font-weight: 800; font-size: 36px; letter-spacing: .28em; text-transform: uppercase; opacity: .72; margin-top: 4px; }
  .fly { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #f2a531; box-shadow: 0 0 30px 12px rgba(242,165,49,.6); }
</style>
</head>
<body>
  <div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div>
  <div class="post"></div>
  <svg class="star" viewBox="0 0 24 24"><path fill="#f2a531" d="M12 2l2.6 6.6L21.5 9l-5.3 4.5L18 20.5 12 16.8 6 20.5l1.8-7L2.5 9l6.9-.4z"/></svg>
  <div class="sign">
    <svg viewBox="0 0 900 300" preserveAspectRatio="none">
      <rect x="0" y="16" width="900" height="284" rx="44" fill="#7d5c47"/>
      <rect x="0" y="0" width="900" height="284" rx="44" fill="#a8846c"/>
      <path d="M90 70 h330 M520 82 h260 M120 230 h220 M470 220 h300" stroke="#8f6e58" stroke-width="6" stroke-linecap="round" opacity=".55"/>
    </svg>
    <div class="t"><b>Story Lab</b><span>Stories for kids</span></div>
  </div>
  <span class="fly" style="left:200px;top:850px"></span>
  <span class="fly" style="left:850px;top:820px"></span>
  <span class="fly" style="left:700px;top:960px"></span>
</body>
</html>
